name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test tests/ClipManager.Core.Tests -c Release

      - name: Programm bauen
        run: >
          dotnet publish src/ClipManager/ClipManager.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: FFmpeg dazulegen
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Directory -Filter bin | Select-Object -First 1
          New-Item -ItemType Directory -Force publish/ffmpeg | Out-Null
          Copy-Item "$($bin.FullName)/*" publish/ffmpeg/
          if (-not (Test-Path publish/ffmpeg/ffmpeg.exe)) { throw "ffmpeg.exe fehlt" }
          & publish/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - uses: actions/upload-artifact@v4
        with:
          name: ClipManager-win-x64
          path: publish/
          retention-days: 30
